{% extends 'front/base.html' %}{% block title %}公告{% endblock %}{% block body %}<h1>職福公告</h1>
{% for a in anns %}<a class="card" style="display:block;color:inherit;text-decoration:none" href="{{ url_for('front.announcement', aid=a.id) }}"><b>{% if a.is_pinned %}📌 {% endif %}{{ a.title }}</b><br><span class="muted small">{{ a.kind }}｜{{ a.publish_date|replace('-','/') }}</span><br>{{ a.content|truncate(70) }}</a>{% else %}<div class="card muted">目前沒有公告。</div>{% endfor %}{% endblock %}
