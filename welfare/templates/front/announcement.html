{% extends 'front/base.html' %}{% block title %}{{ a.title }}{% endblock %}{% block body %}<p><a href="{{ url_for('front.announcements') }}" class="small">← 公告列表</a></p>
<div class="card"><h1>{{ a.title }}</h1><p class="muted small">{{ a.kind }}｜{{ a.publish_date|replace('-','/') }}</p>
{% if a.image %}<img src="{{ url_for('front.uploads', name=a.image) }}" alt="" style="max-width:100%;border-radius:8px">{% endif %}<p class="pre">{{ a.content }}</p></div>{% endblock %}
